<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Flask 1.0</title>
    <!-- url_for gera o caminho correto para a pasta "static" -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <main class="card">
        <h1>Hello, Flask!</h1>
        <p class="subtitulo">Versão 1 — Fundamentos do Desenvolvimento Web</p>

        <button id="btn-mensagem">Clique aqui</button>

        <!-- Elemento do DOM que o JavaScript vai alterar -->
        <p id="mensagem"></p>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
